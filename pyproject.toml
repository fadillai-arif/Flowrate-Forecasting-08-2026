[project]
name = "flowrate-forecasting"
version = "1.0.0"
description = "Flowrate forecasting app with weather data from Open-Meteo"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "openmeteo-requests>=1.3.0",
    "requests-cache>=1.1.0",
    "retry-requests>=2.0.0",
]
